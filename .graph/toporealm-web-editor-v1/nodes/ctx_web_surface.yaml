boundary: 负责浏览器端 Svelte 状态、画布、布局、选择、检视器、面板和只读交互；不负责持久化、revision 判断或模块领域规则。
glossary:
  - term: 视图状态
    definition: 缩放、平移、选择和临时布局坐标，只影响浏览器呈现，不写入 Core。
  - term: 通用编辑
    definition: 以 MutationPlan 请求对象或关系的增删改，不猜测模块私有语义。
  - term: 只读模式
    definition: 保留查看、搜索、校验和原始数据能力，同时禁用所有写入入口。
