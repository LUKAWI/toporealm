entry:
  description: TopoRealm Core v1 已完成，但现有 Web 仅为最小 shell；需要在不修改 Core 数据模型、不修改 topological-tool 的前提下，建设可交互的通用图编辑器。
  defined_by: human
  level: 0
exit:
  description: 浏览器可打开 TopoRealm 图并完成查看、布局、缩放、平移、选择、搜索、筛选、通用新增/编辑/连接/删除、撤销/重做、原始数据/校验/模块状态/只读操作；所有写入经 Server 进入同一 Core revision 历史。
  acceptance_criteria:
    - 启动 TopoRealm Server 后，浏览器加载真实 GraphSnapshot；画布能渲染对象与关系，缩放、平移、拖拽和选择均不改变 Core 数据语义。
    - 用户可通过通用编辑器新增、修改、删除对象与关系；写入产生连续 revision，刷新后仍可见，并可用撤销/重做恢复。
    - 搜索、筛选、原始数据、校验结果、模块状态与只读模式可用；缺失或不兼容模块的数据仍可查看且不会被 UI 改写。
    - revision 冲突、patch gap、模块 UI/动作失败均显示可恢复的用户错误，不覆盖本地未确认修改。
    - TopoRealm 工作区的构建、类型检查、测试和浏览器验收通过，且不修改 D:/LUKAWI/AI_project/projects/topological-tool。
  defined_by: human
  level: 0
