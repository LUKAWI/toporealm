id: adr_0022
type: adr
label: 复用现有 Web UI 外壳并限制扩展插槽
level: 1
status: accepted
attempts: 0
max_attempts: 0
created_at: '2026-09-08T11:51:26.801Z'
updated_at: '2026-09-08T11:51:48.574Z'
decision: >-
  TopoRealm 复用 Super Plumber 现有 Web UI 的应用外壳、图选择、D3 画布、缩放平移、选择状态和基础详情面板，并把工作流专属渲染移入模块贡献。基座提供通用对象与关系展示、Schema
  驱动表单、模块状态和缺失模块降级界面。模块优先贡献声明式样式、表单和动作；需要专用交互时可通过单一 ui/entry.js 注册到基座定义的少量固定插槽，不得替换应用外壳或直接持有图存储。
background: 用户要求 Web UI 属于基座并尽量复用当前实现，同时模块需要支持研究、学习和其他高度不同的领域界面。
considered_options: 完全重写能获得纯净结构但成本高；只允许声明式 UI 最简单但限制高度自定义模块；允许模块任意接管页面容易形成多套前端和状态源；复用外壳并提供有限插槽能控制改造范围。
why: 现有画布交互已有可复用价值；固定插槽与统一图存储使模块 UI 可扩展而不破坏基座导航和同步语义。
consequences: 需要逐步抽离工作流专属组件；模块 UI 与基座使用同一前端运行时；首版插槽数量保持最少，只有真实模块需要时才新增。
