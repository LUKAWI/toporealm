id: adr_0011
type: adr
label: 统一模块命名空间与自建模块协议
level: 1
status: accepted
attempts: 0
max_attempts: 0
created_at: '2026-09-08T07:17:34.646Z'
updated_at: '2026-09-08T07:17:45.648Z'
decision: kind 与能力 ID 的第一段是模块命名空间；模块清单声明稳定 ID、图内唯一 namespace 和受支持的数据模式；用户自建模块与官方模块遵循同一协议和能力边界，只允许安装来源不同。
background: TopoRealm 需要识别用户自建类型、避免类型名称冲突，并确保高度自定义模块不依赖基座中的专用分支。
considered_options: 按文件扩展名识别：与领域身份无关；为自建扩展另设受限接口：会形成双轨生态；统一命名空间和模块协议：采用。
why: 统一协议让简单声明式模块和带运行时、UI、Skills 的复杂模块逐步增强，同时保留缺失模块时的归属信息。
consequences: 同一图内命名空间必须唯一；首版不提供图内别名；自建模块需先本地安装或链接再激活；缺失模块只保留和显示数据，不能执行其语义。
