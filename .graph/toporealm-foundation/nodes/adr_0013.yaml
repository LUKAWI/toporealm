id: adr_0013
type: adr
label: 缺失模块时采用有限降级编辑
level: 1
status: accepted
attempts: 0
max_attempts: 0
created_at: '2026-09-08T07:35:32.135Z'
updated_at: '2026-09-08T07:35:43.142Z'
decision: 模块缺失时允许查看、搜索、布局调整、修改基座字段、重连和可恢复删除；结构化界面不得改写未知 data、增删未知 capabilities 或直接改变未知 kind；原始 YAML 仍可编辑，但只能进行基础校验。
background: 缺少模块时既要避免锁死整张图，也要保证基座不会误解并损坏模块拥有的数据。
considered_options: 整图只读：安全但妨碍通用整理；允许任意结构化编辑：灵活但可能破坏未知语义；按数据所有权限制编辑：采用。
why: 基座可以可靠维护自己拥有的结构，而模块私有数据只有相应模块具备解释和迁移资格。
consequences: 关系重连和删除在缺少模块时只能获得基础校验；直接修改 YAML 后同样不具备完整校验；恢复兼容模块后重新获得领域表单、规则和操作。
