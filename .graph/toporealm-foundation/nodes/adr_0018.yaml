id: adr_0018
type: adr
label: 模块采用两阶段分类不可变注册快照
level: 1
status: accepted
attempts: 0
max_attempts: 0
created_at: '2026-09-08T11:24:20.989Z'
updated_at: '2026-09-08T11:24:41.864Z'
decision: >-
  工作区先由 WorkspaceModuleResolver 解析绑定、来源、版本和依赖，图再由 GraphActivator 生成图级不可变 GraphRegistrySnapshot。贡献按对象类型、关系类型、能力、校验器、操作和
  UI 分类注册；身份仅要求在所属类别内唯一。单个模块的注册原子化，失败不留下部分贡献，也不阻断其他独立模块。运行时代码只能绑定清单已声明的实现，不能修改注册表或登记未声明贡献。Core、CLI、MCP 与 Web UI
  读取同一图级快照。
background: TopoRealm 需要同时支持多个官方、自建、纯文件和 npm 模块，并保证缺失或损坏模块可局部降级。单层动态注册容易混淆工作区可用状态与图级启用状态，也容易让不同界面看到不一致能力。
considered_options: 保留 Super Plumber 的静态枚举最简单但不能承载开放模块；单个扁平全局注册表实现较少但会制造跨类别冲突，并让工作区与图的生命周期耦合；两阶段分类快照增加一个明确的激活步骤。
why: 两阶段结构把安装解析与图语义激活分开；分类注册符合贡献的不同职责；不可变快照让一次请求使用稳定能力集合；模块级原子注册把故障限制在单个模块。
consequences: 基座需要定义快照修订号、冲突诊断和失效重建机制；模块更新或绑定变化后要生成新快照；所有产品界面必须通过快照访问模块贡献。
