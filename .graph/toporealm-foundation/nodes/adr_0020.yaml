id: adr_0020
type: adr
label: 运行时通过变更计划请求图写入
level: 1
status: accepted
attempts: 0
max_attempts: 0
created_at: '2026-09-08T11:27:50.695Z'
updated_at: '2026-09-08T11:28:00.056Z'
decision: >-
  模块运行时不得通过 TopoRealm 受支持 API 直接改写图文件。会改变图的操作处理器返回声明式 MutationPlan，由 Core
  统一完成模式校验、适用性校验、并发控制、原子写入和事件记录。校验器保持只读；查询、推荐和导出操作可以返回结果或产物而不生成变更计划。可信本地 JavaScript
  首版不提供代码沙箱，但直接文件系统写入不属于受支持契约，也不获得事务、校验和事件保证。
background: 可信代码钩子必须支持复杂领域行为，同时不能绕过 Core 已有的统一写入、校验和事件边界，否则 CLI、MCP 与 Web UI 会产生不同写入语义，并增加部分写入和并发覆盖风险。
considered_options: 允许处理器直接调用写 API 实现简单但扩大可变状态面；允许直接改文件最灵活但无法保证一致性；返回声明式变更计划增加少量协议结构，却能由 Core 统一治理所有图变更。
why: 变更计划把领域计算与持久化分离，使模块行为可预检、可解释并可由所有界面一致执行；Core 保持图事实来源的唯一受支持写入者。
consequences: Core 需要定义变更计划操作集、校验顺序、结果摘要和失败语义；复杂操作可能产生较大的计划，因此 MCP 默认返回摘要并支持按需读取详情；外部副作用的边界仍需单独确定。
