id: adr_0034
type: adr
label: 模块故障局部隔离并回退通用界面
level: 1
status: accepted
attempts: 0
max_attempts: 0
created_at: '2026-09-08T13:46:13.048Z'
updated_at: '2026-09-08T13:46:15.688Z'
decision: 单个模块装载失败时只使该模块不可用，Core 和其他无依赖模块继续工作；单次运行时动作异常只使该动作失败。自定义 UI 插槽使用错误边界，失败后回退通用对象与关系界面。
background: 模块扩展不能降低基座与其他模块的基本可用性，且需要与缺失模块无损读取原则一致。
considered_options: 任一模块失败则整图失败：简单但脆弱；复杂熔断与健康系统：首版过重；局部隔离和通用回退：采用。
why: 以最小机制保证扩展故障不会拖垮整张图。
consequences: 模块私有行为和完整校验暂停，但原始数据继续无损可读；首版无健康评分、熔断器或可配置重试。
