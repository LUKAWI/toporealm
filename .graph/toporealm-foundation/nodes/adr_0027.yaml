id: adr_0027
type: adr
label: 模块绑定驱动用户级与项目级宿主投影
level: 1
status: accepted
attempts: 0
max_attempts: 0
created_at: '2026-09-08T12:15:49.098Z'
updated_at: '2026-09-08T12:15:58.313Z'
decision: >-
  全局模块的 Skills 投影到各宿主用户级目录，workspace 与 path 模块投影到当前项目的宿主目录。.toporealm/modules.yaml
  是项目投影的期望状态，不增加独立投影配置。每个生成目录包含模块身份、版本、来源与生成器身份的所有权标记；host sync 据此创建、更新和清理投影，卸载时只删除所有权匹配的生成目录，不修改用户手写资产。
background: 模块安装与图级启用已分离，三套宿主投影也已确认；仍需确定全局和项目模块如何进入宿主 Skill 发现路径以及如何安全卸载。
considered_options: 全部投影到用户目录最简单但项目私有模块会泄漏到其他项目；全部投影到项目目录会重复全局模块；另建一份投影配置会产生双重事实来源；按模块绑定来源映射范围最直接。
why: 安装范围自然映射宿主发现范围，现有绑定文件即可重建投影；目录级所有权标记足以保护用户手写 Skills，无需复杂资产数据库。
consequences: 三宿主适配器需知道各自用户级与项目级路径；不支持项目级发现的宿主由其适配器提供等价项目入口；删除或升级只操作 TopoRealm 标记的目录。
