id: adr_0006
type: adr
label: 基座 Skills 与模块 Skills 分层
level: 1
status: accepted
attempts: 0
max_attempts: 0
created_at: '2026-09-08T06:23:09.671Z'
updated_at: '2026-09-08T06:23:40.206Z'
decision: 基座内建 toporealm、toporealm-design、toporealm-join；模块安装决定模块 Skill 是否存在，图级启用决定它能否作用于当前图。
background: 基座需要统一路由、通用建图和跨会话入场，但领域方法不能在模块断开后继续生效。
considered_options: 所有 skills 随核心安装：耦合过重；按单图物理装卸：会影响其他图；基座 skills 加模块安装生命周期：采用。
why: 保持基座可独立使用，同时让 skills 与模块真实归属并支持多图并存。
consequences: 已安装但当前图未启用的模块 Skill 必须先检查适用性并停止领域动作。
