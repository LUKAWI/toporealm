id: adr_0023
type: adr
label: Web UI 使用带版本的增量变更事件
level: 1
status: accepted
attempts: 0
max_attempts: 0
created_at: '2026-09-08T11:51:48.722Z'
updated_at: '2026-09-08T11:51:56.549Z'
decision: >-
  Web UI 首次连接接收整图快照，此后由 Core 在 MutationPlan 提交成功后发送单个递增 revision 的 graph:patch 事件，事件只携带本次对象、关系或图元数据变化。前端在现有图桶中原子应用
  patch，保持画布位置、缩放、选择和未变化实体引用。只有首次连接、断线重连、revision 不连续或外部编辑无法形成可靠 patch 时才重新获取整图快照。派生索引与事件日志文件变化不得触发整图广播。
background: >-
  当前实现虽对 node:updated 做局部更新，但 writeNodeCore 会使 index 缓存失效；文件监听器把 index 等其他事件安排为 graph:update 全量广播，前端替换 GraphIndex 并可能触发
  D3 重绘，造成状态变化后界面闪烁。
considered_options: 维持全量广播最省后端改动但保留闪烁和大图开销；为每种文件事件设计独立消息会扩大协议；用 MutationPlan 的提交结果生成统一 patch 事件能覆盖各类实体变化并避免监听派生文件。
why: 统一 patch 直接复用 Core 已有的变更计划边界，只增加 revision 和 changes 两个必要概念；正常状态更新不再重载整图，版本断档仍能可靠降级为全量同步。
consequences: Core 需要维护每图单调 revision；Web UI 需要对象和关系的增量归并器；文件系统外部编辑仍由 watcher 发现并触发一次协调后的全量同步；首版断线后直接全量同步，不建立事件重放系统。
