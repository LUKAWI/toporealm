id: adr_0028
type: adr
label: npm tarball 解包为自包含模块目录
level: 1
status: accepted
attempts: 0
max_attempts: 0
created_at: '2026-09-08T12:53:33.528Z'
updated_at: '2026-09-08T12:53:52.560Z'
decision: >-
  npm 仅作为模块获取渠道。toporealm module add 使用 npm pack --ignore-scripts 获取 tarball，校验后直接解包到工作区或用户级 modules 目录；安装后不依赖
  node_modules。受管模块保留轻量来源记录，用户手写模块不被安装器覆盖或删除。对外分发模块必须提供已编译并打包普通依赖的运行时与 Web UI bundle。
background: ADR-0017 曾采用 TopoRealm 专属 node_modules 环境。进一步讨论确认，模块协议应独立于 npm 安装结构，并让 npm 模块与用户手写模块在解析、注册和宿主投影上地位等同。
considered_options: 专属 node_modules：能直接复用 npm 依赖安装，但保留第二套运行结构；扫描宿主 node_modules：隐式且易受项目依赖影响；tarball 解包到 modules：采用，运行结构统一且便于检查、复制和卸载。
why: 统一安装后的模块形态，降低解析和生命周期复杂度，并为 tarball、Git 或私有仓库等后续获取渠道复用同一安装核心。
consequences: 分发模块必须自包含；首版不支持外部 node_modules、安装脚本、安装阶段编译或原生二进制依赖；TopoRealm 安装器负责获取、校验、原子落盘、绑定和宿主投影同步。
