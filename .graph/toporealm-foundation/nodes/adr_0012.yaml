id: adr_0012
type: adr
label: 实体使用图内统一 ID 空间
level: 1
status: accepted
attempts: 0
max_attempts: 0
created_at: '2026-09-08T07:24:38.724Z'
updated_at: '2026-09-08T07:24:53.370Z'
decision: 对象与关系在单图内共享唯一且不可变的 ID；关系端点首版只允许引用本图对象；图外指代采用 graph-id#entity-id 限定形式，但首版不支持跨图关系。
background: Core、CLI、MCP 和 Web UI 需要仅凭 ID 无歧义定位实体，同时图应能独立移动、复制和删除。
considered_options: 对象与关系各自编号：会使通用实体 API 歧义；全局 UUID：唯一但降低人工编辑体验；图内统一 ID 加限定引用：采用。
why: 图内统一空间兼顾人工可读 ID 与无歧义寻址，限制本地端点可以保持图的自包含性。
consequences: 合并产生的重复 ID必须报基础校验错误；名称变化只能修改 label；跨图导航暂由模块数据或能力表达，后续按真实用例演进。
