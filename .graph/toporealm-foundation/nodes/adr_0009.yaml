id: adr_0009
type: adr
label: 关系采用一等实体结构
level: 1
status: accepted
attempts: 0
max_attempts: 0
created_at: '2026-09-08T06:53:19.647Z'
updated_at: '2026-09-08T06:53:32.159Z'
decision: >-
  关系必须包含 id、kind、source、target 和 direction；direction 显式取 directed 或 undirected；关系类型数据存入 data，可组合能力状态存入
  capabilities，通用记录信息存入 meta。
background: TopoRealm 的关系需要被独立引用、编辑和扩展，并且在关系类型模块缺失时仍可由基座正确遍历和显示。
considered_options: 对象内嵌边：简单但难以独立引用；方向由模块隐式决定：精简但缺失模块时无法可靠遍历；显式一等关系：采用。
why: 显式结构让连接拓扑不依赖模块解释，同时让关系和对象共享一致的数据所有权及扩展模型。
consequences: 所有关系必须明确方向；无向关系的 source 与 target 只表示稳定存储顺序；关系能力会增加少量契约面积，但避免日后为时间性或权重引入旁路字段。
