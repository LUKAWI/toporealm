id: adr_0016
type: adr
label: 模块依赖显式绑定且不自动安装
level: 1
status: accepted
attempts: 0
max_attempts: 0
created_at: '2026-09-08T08:29:46.903Z'
updated_at: '2026-09-08T08:30:00.179Z'
decision: 模块可声明带 SemVer 范围的硬依赖；工作区必须显式绑定具体版本或路径，图必须显式启用依赖；基座只校验兼容性并按无环拓扑注册，不自动安装或求解版本。
background: 模块组合需要表达运行时兼容关系，但首版应避免隐藏激活、远程解析和复杂依赖求解。
considered_options: 禁止模块依赖：简单但限制组合；自动安装与求解：方便但系统复杂；显式依赖和绑定：采用。
why: 显式模型保持解析结果可说明，同时用最小机制支持模块复用和有序注册。
consequences: 缺少依赖时依赖方模块整体不可用；首版没有可选依赖和条件贡献；普通代码库依赖由模块分发载体处理。
