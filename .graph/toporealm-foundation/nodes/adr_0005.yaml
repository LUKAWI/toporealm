id: adr_0005
type: adr
label: 模块采用声明优先与可信代码钩子
level: 1
status: accepted
attempts: 0
max_attempts: 0
created_at: '2026-09-08T06:23:08.708Z'
updated_at: '2026-09-08T06:23:39.295Z'
decision: 模块以声明式清单定义类型、能力、关系、校验和界面贡献，复杂算法可提供本地受信任代码钩子。
background: 纯声明无法覆盖学习调度和证据推导，完全代码化又会提高简单模块成本。
considered_options: 纯声明；全代码插件；声明优先加可选代码钩子：采用。
why: 让简单模块保持轻量，同时为复杂领域保留完整扩展出口。
consequences: 第一阶段只加载本地明确安装的可信模块，不建设远程市场和沙箱。
