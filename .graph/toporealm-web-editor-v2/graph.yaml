    - 真实浏览器点击任意对象或关系都稳定打开右侧玻璃详情抽屉，至少显示稳定 ID、kind、label、data、capabilities、meta；连续切换无空白检视器、无旧选择残留；未知 kind 与缺失模块仍显示原始数据。
