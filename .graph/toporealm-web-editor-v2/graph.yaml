    - 左键选择、节点拖动、空白清除、中键平移、滚轮缩放、双击重置互不抢事件、连续流畅；browser use 逐项通过并留证据。
    - 对象/关系新增、修改、删除、连接经 MutationPlan 提交成功；revision、undo/redo、刷新持久化可见；失败保留输入并显示稳定错误；只读模式禁用全部写入口。
    - npm run verify 与 web:browser-smoke 退出码 0；D:/LUKAWI/AI_project/projects/topological-tool 工作区无新增改动；用户人审 gate 通过。
