plan:
  description: >-
    重写 web-ui/src/lib/GraphCanvas.svelte 为参考实现同款交互契约与星空视觉：d3 力导向 + 按图位置缓存 + fit 管线（挂接模拟收敛、resize
    重取景、用户动过视角不抢取景）；节点为星体（halo/八向星芒/白炽核，色彩表达对象 kind/模块 presentation，无工作流状态）；关系为渐隐线，directed 用不对称渐变加方向指示、undirected
    对称渐隐，hover 显示端点与 kind 标签，12 单位透明命中线；hover/selected/focus 用明度声呐环（ring-bloom + flash + 星芒增亮），tooltip 显示超长
    label。交互契约：左键点击选择、节点拖拽（fx/fy +
    位置缓存）、空白点击清除选中、中键平移（setPointerCapture，pointerup/pointercancel/pointerleave/lostpointercapture
    全部结束路径）、滚轮缩放、双击重置、触控手势、键盘 Tab 循环/Enter 选中/加减缩放/0 适配；缩放提示条。交互契约写入
    web-ui/src/lib/GraphCanvas.interaction.md。只改画布组件、布局与测试；视图状态不写 Core。
expected_outcome:
  definition_of_done:
    - >-
      真实浏览器逐项验证：点击对象与关系出现选中反馈且回调携带稳定 ID；拖拽节点平滑、松手不粘连、不触发 Core 写入；中键在空白与节点上拖动均连续平移，capture
      释放后可再次开始；滚轮缩放、双击重置、空白点击清除互不抢事件。
    - 触控模拟下手势可用；prefers-reduced-motion 时装饰动画关闭；directed 关系方向在画布可辨识（浏览器证据）。
    - 组件测试覆盖：渲染对象/关系数量与快照一致、选择回调、方向呈现、布局确定性；npm run web:verify 通过。
