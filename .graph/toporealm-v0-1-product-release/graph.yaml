label: TopoRealm v0.1 产品发布
entry:
  description: 从已冻结的 TopoRealm v1 基座与通过人审的 Web 编辑器 v2 出发，将领域无关的完整产品收敛为可公开安装的 @lukawi/toporealm v0.1 Preview。
  defined_by: human
  level: 0
exit:
  description: >-
    公开用户可在 Windows、macOS、Linux 的干净 Node.js 20+ 环境安装 @lukawi/toporealm，初始化工作区、启动 Web、连接 MCP、使用基础 Skills，并通过外部 fixture
    验证模块生态；npm、Git tag 与 GitHub Release 证据一致。
  acceptance_criteria:
    - npm 安装包不含 research、exploration、workflow 或其他领域模块，根导出面也不暴露其实现。
    - CLI、stdio MCP、Web UI 与工作区/图解析共用 Core，并完成干净安装 smoke。
    - Codex、Claude、Pi 三套直接可识别资产均能连接同一 MCP 并加载四个基础 Skills。
    - Windows、macOS、Linux 的 Node.js 20+ CI 安装、CLI、MCP 与 Web smoke 全部通过。
    - 用户批准发布后，npm 包、远端提交、v0.1.0 tag 和 GitHub Release 均可核验。
  defined_by: human
  level: 0
