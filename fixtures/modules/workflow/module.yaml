format: toporealm.module/v1alpha1
id: workflow
namespace: workflow
version: 0.1.0
supports:
  schemas: [1]
contributes:
  object_kinds:
    - id: task
      declaration: schemas/task.yaml
    - id: checkpoint
      declaration: schemas/checkpoint.yaml
    - id: execution_report
      declaration: schemas/execution-report.yaml
  relation_kinds:
    - id: depends_on
      declaration: schemas/depends-on.yaml
    - id: checkpoint_for
      declaration: schemas/checkpoint-for.yaml
    - id: report_for
      declaration: schemas/report-for.yaml
  operations:
    - id: transition-task
      declaration: operations/transition-task.yaml
    - id: record-checkpoint
      declaration: operations/record-checkpoint.yaml
    - id: record-report
      declaration: operations/record-report.yaml
    - id: next-actions
      declaration: operations/next-actions.yaml
ui:
  contribution: ui/contribution.yaml
skills:
  directory: skills
